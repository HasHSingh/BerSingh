<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sito a Sezioni Alternate</title>
</head>
<body>

    <section class="row section-one">
        <div class="container">
            <div class="image-col">
                <img src="images/Sakura.png" alt="Sakura">
            </div>
            <div class="text-col">
                <h1>Giorgia & Hashpreet</h1>
                <div id="FirstSectionDiv">
                    <p id="FirstSectionText">Save the date</p>
                </div>
                
            </div>
        </div>
    </section>

    <section class="row section-two">
        <div class="container">
            <div class="image-col">
                <img src="https://picsum.photos/seed/tech/800/600" alt="Test 2">
            </div>
            <div class="text-col">
                <h2>Seconda Sezione</h2>
                <p>In questa sezione abbiamo invertito le posizioni grazie alla proprietà CSS <code>flex-direction: row-reverse</code>.</p>
            </div>
        </div>
    </section>

    <section class="row section-three">
        <div class="container">
            <div class="image-col">
                <img src="images/Torii.png" alt="Torii">
            </div>
            <div class="text-col">
                <h2>Terza Sezione</h2>
                <p>Torniamo alla disposizione originale. Semplice, pulito e perfetto per GitLab Pages.</p>
            </div>
        </div>
    </section>

</body>
</html>
